name: peaky-backend-advanced-lantern
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lantern
      POSTGRES_PASSWORD: demo-only
      POSTGRES_DB: lantern
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["lantern-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lantern -d lantern"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://lantern:demo-only@db:5432/lantern
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  seed:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://lantern:demo-only@db:5432/lantern
    command: ["python", "seed.py"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://lantern:demo-only@db:5432/lantern
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
  receiver:
    build: .
    command: ["uvicorn", "mock_receiver:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["127.0.0.1:8001:8001"]
volumes:
  lantern-data:
